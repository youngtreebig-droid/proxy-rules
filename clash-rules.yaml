# mihomo/Nikki 覆写；先导入节点。AI 固定德国，默认固定香港上海电信。
mode: rule
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - 🇭🇰 上海电信
- name: 🇭🇰 上海电信
  type: url-test
  include-all-proxies: true
  filter: (?i)(香港|Hong Kong|HK).*上海电信
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: ♻️ 自动测速
  type: url-test
  include-all-proxies: true
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇩🇪 德国节点
  type: select
  include-all-proxies: true
  filter: 德国|法兰克福|(?i:Germany|Frankfurt)
- name: 🤖 AI
  type: select
  proxies:
  - 🇩🇪 德国节点
- name: 🎬 流媒体
  type: select
  proxies:
  - 🇭🇰 上海电信
  - ♻️ 自动测速
  include-all-proxies: true
rule-providers:
  AIInternational:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs
    path: ./ruleset/AIInternational.mrs
    interval: 86400
  ChinaDomains:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
