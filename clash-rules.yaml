# 分流规则配置（不含节点）—— 节点由 proxy-provider 从你的节点订阅拉取
# 使用前：把下面 proxy-providers 里的 url 换成你自己的节点订阅地址
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://dns.alidns.com/dns-query
    - 223.5.5.5
  fallback:
    - https://dns.google/dns-query
proxy-providers:
  youngtree:
    type: http
    url: "https://example.com/REPLACE-WITH-YOUR-NODE-SUBSCRIPTION.txt"
    interval: 86400
    path: ./providers/youngtree.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动测速
    use:
      - youngtree
  - name: ♻️ 自动测速
    type: url-test
    use:
      - youngtree
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🤖 AI
    type: select
    use:
      - youngtree
  - name: 🎬 流媒体
    type: select
    proxies:
      - ♻️ 自动测速
    use:
      - youngtree
