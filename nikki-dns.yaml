# 与 clash-rules.yaml 合并使用。LuCI 中同名选项优先，部署步骤见 README。
dns:
  enable: true
  listen: '[::]:1053'
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localhost
  - +.synology.me
  - +.quickconnect.to
  respect-rules: true
  default-nameserver:
  - 223.5.5.5
  - 223.6.6.6
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
  direct-nameserver:
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
  direct-nameserver-follow-policy: false
  nameserver:
  - https://1.1.1.1/dns-query#🚀 节点选择
  - https://8.8.8.8/dns-query#🚀 节点选择
  nameserver-policy:
    rule-set:ChinaDomains,PrivateDomains:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      override-destination: true
      port:
      - 80
      - 8080
    TLS:
      override-destination: true
      port:
      - 443
      - 8443
    QUIC:
      override-destination: true
      port:
      - 443
      - 8443
